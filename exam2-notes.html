<script>
const items = JSON.parse(document.getElementById("notes").textContent);
const doc = document.getElementById("doc");
const playBtn = document.getElementById("play");
const prog = document.getElementById("prog");
const r1 = document.getElementById("r1");
const r2 = document.getElementById("r2");
const blocks = [];
function lineText(item) { return item.runs.map(r => r.t).join(""); }
items.forEach((item, i) => {
  const el = document.createElement("p");
  el.className = "line";
  el.style.marginLeft = (item.level * 16) + "px";
  item.runs.forEach(r => {
    if (r.b) {
      const s = document.createElement("span");
      s.className = "b";
      s.textContent = r.t;
      el.appendChild(s);
    } else {
      el.appendChild(document.createTextNode(r.t));
    }
  });
  el.addEventListener("click", () => jump(i));
  doc.appendChild(el);
  blocks.push(el);
});

const storeKey = "lp105-exam2-notes-idx";
const rateKey = "lp105-exam2-notes-rate";
let idx = Number(localStorage.getItem(storeKey) || 0);
if (!Number.isFinite(idx) || idx < 0 || idx >= items.length) idx = 0;
let part = 0;
let parts = [];
let playing = false;
let rate = Number(localStorage.getItem(rateKey) || 1);
if (rate !== 2) rate = 1;
let token = 0;
let lock = null;

function speakable(s) {
  return s
    .replace(/^\s*[-–—]\s*/, "")
    .replace(/\bIe\.?/g, "For example")
    .replace(/\bie\.?/g, "for example")
    .replace(/\bppl\b/gi, "people")
    .replace(/\bBC\b/g, "because")
    .replace(/\bbc\b/g, "because")
    .replace(/\bw\//g, "with ")
    .replace(/→/g, ". ")
    .replace(/\|+/g, ". ")
    .replace(/~/g, "about ")
    .replace(/#/g, " number ")
    .replace(/⅓/g, " one third ")
    .replace(/½/g, " one half ")
    .replace(/•/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function chunk(s) {
  const out = [];
  let cur = "";
  const words = s.split(" ");
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    const next = cur ? cur + " " + w : w;
    const end = /[.!?]$/.test(w);
    if (next.length > 190 && cur) { out.push(cur); cur = w; }
    else cur = next;
    if (end && cur.length > 40) { out.push(cur); cur = ""; }
  }
  if (cur) out.push(cur);
  return out.length ? out : [s];
}
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /en-US/i.test(v.lang) && /samantha|aaron|nicky|google/i.test(v.name))
    || voices.find(v => /^en/i.test(v.lang));
}
function mark() {
  blocks.forEach(el => el.classList.remove("on"));
  const el = blocks[idx];
  if (!el) return;
  el.classList.add("on");
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  prog.textContent = (idx + 1) + " / " + items.length;
  localStorage.setItem(storeKey, String(idx));
}
function paintRate() {
  r1.classList.toggle("pick", rate === 1);
  r2.classList.toggle("pick", rate === 2);
  localStorage.setItem(rateKey, String(rate));
}
function loadParts() {
  parts = chunk(speakable(lineText(items[idx])));
  part = 0;
}
async function wake() {
  try { if (navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function finish() {
  playing = false;
  playBtn.textContent = "Play";
  token++;
  if (idx >= items.length) idx = 0;
  mark();
}
function speakCurrent() {
  const my = ++token;
  if (!parts[part]) { finish(); return; }
  const u = new SpeechSynthesisUtterance(parts[part]);
  u.rate = rate;
  u.lang = "en-US";
  const v = pickVoice();
  if (v) u.voice = v;
  const advance = () => {
    if (my !== token || !playing) return;
    part += 1;
    if (part >= parts.length) {
      idx += 1;
      if (idx >= items.length) { finish(); return; }
      loadParts();
      mark();
    }
    speakCurrent();
  };
  u.onend = advance;
  u.onerror = (e) => {
    const err = e && e.error;
    if (err === "interrupted" || err === "canceled" || err === "cancelled") return;
    advance();
  };
  speechSynthesis.speak(u);
}
function play() {
  if (idx >= items.length) idx = 0;
  if (!parts.length || part >= parts.length) loadParts();
  playing = true;
  playBtn.textContent = "Pause";
  mark();
  wake();
  speakCurrent();
}
function pause() {
  playing = false;
  token++;
  playBtn.textContent = "Play";
  speechSynthesis.cancel();
}
function jump(i) {
  const was = playing;
  pause();
  idx = i;
  loadParts();
  mark();
  if (was) play();
}
playBtn.addEventListener("click", () => { if (playing) pause(); else play(); });
function setRate(n) {
  rate = n;
  paintRate();
  if (!playing) return;
  const wasPart = part;
  pause();
  part = wasPart;
  play();
}
r1.addEventListener("click", () => setRate(1));
r2.addEventListener("click", () => setRate(2));
speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  setInterval(() => {
    if (!playing || !speechSynthesis.speaking) return;
    speechSynthesis.pause();
    speechSynthesis.resume();
  }, 10000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && playing) wake();
});
paintRate();
mark();
document.getElementById("hint").textContent = "Open this in Safari. Play reads the Exam 2 section line by line. Green is what you bolded in the notes. Indent follows the doc. 1× and 2× set the speed.";
</script>
