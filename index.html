<script id="notes" type="application/json">
[{"nest": null, "text": "1. Motivation", "runs": [{"t": "1. Motivation", "b": false}]}, {"nest": 0, "text": "a. Intrinsic and extrinsic motivation", "runs": [{"t": "a. Intrinsic and extrinsic motivation", "b": false}]}, {"nest": 1, "text": "Extrinsic motivation is driven by external consequences separate from the activity itself. The goal is to earn rewards or avoid punishment. The focus is external outcomes: pay, praise, grades. The driver is instrumental task completion.", "runs": [{"t": "Extrinsic motivation is driven by external consequences separate from the activity itself. The goal is to earn rewards or avoid punishment. The focus is external outcomes: pay, praise, grades. The driver is instrumental task completion.", "b": false}]}, {"nest": 1, "text": "Intrinsic motivation is driven by the inherent satisfaction of performing the activity. The goal is personal growth, identity, and enjoyment. The focus is a sense of accomplishment and alignment. The driver is core values, interest, and identity.", "runs": [{"t": "Intrinsic motivation is driven by the inherent satisfaction of performing the activity. The goal is personal growth, identity, and enjoyment. The focus is a sense of accomplishment and alignment. The driver is core values, interest, and identity.", "b": false}]}, {"nest": 1, "text": "Your notes tie extrinsic motivation to expectancy theory. Valence: do I want this outcome? Instrumentality: if I perform well, will I get it? Expectancy: if I try hard, can I perform well?", "runs": [{"t": "Your notes tie extrinsic motivation to expectancy theory. Valence: do I want this outcome? Instrumentality: if I perform well, will I get it? Expectancy: if I try hard, can I perform well?", "b": false}]}, {"nest": 1, "text": "Dangers of extrinsic motivation: the person does the minimum to get the carrots or avoid the sticks, and tries to game the system.", "runs": [{"t": "Dangers of extrinsic motivation: the person does the minimum to get the carrots or avoid the sticks, and tries to game the system.", "b": false}]}, {"nest": 1, "text": "Intrinsic motivation is positively associated with creative and innovative performance. Extrinsic motivation has a complex relationship with creativity.", "runs": [{"t": "Intrinsic motivation is positively associated with creative and innovative performance. Extrinsic motivation has a complex relationship with creativity.", "b": false}]}, {"nest": 1, "text": "Hydraulic crowding-out effect: increasing extrinsic rewards can undermine and diminish pre-existing intrinsic passion. Extrinsic and intrinsic motivators are not additive.", "runs": [{"t": "Hydraulic crowding-out effect: increasing extrinsic rewards can undermine and diminish pre-existing intrinsic passion. Extrinsic and intrinsic motivators are not additive.", "b": false}]}, {"nest": 1, "text": "A lens: how the work feels to the employee, the subjective meaning from the employee’s perspective. Origin mindset: I am the cause of this. I chose what to do and how to do it. That is intrinsic motivation. Pawn mindset: something outside me is the cause. A boss, a bonus, a rule, or a threat is moving me. That is extrinsic motivation.", "runs": [{"t": "A lens: how the work feels to the employee, the subjective meaning from the employee’s perspective. ", "b": false}, {"t": "Origin mindset:", "b": true}, {"t": " I am the cause of this. I chose what to do and how to do it. That is intrinsic motivation. ", "b": false}, {"t": "Pawn mindset", "b": true}, {"t": ": something outside me is the cause. A boss, a bonus, a rule, or a threat is moving me. That is extrinsic motivation.", "b": false}]}, {"nest": 1, "text": "To the extent that: this is a dial, not binary. The more the job feels like your own, the stronger the intrinsic motivation. The more it feels like someone else is pushing you, the more the motivation is extrinsic.", "runs": [{"t": "To the extent that: this is a dial, not binary. The more the job feels like your own, the stronger the intrinsic motivation. The more it feels like someone else is pushing you, the more the motivation is extrinsic.", "b": false}]}, {"nest": 1, "text": "Teresa Amabile’s caveat, the distinction between good and bad extrinsic motivation. Controlling, non-synergistic extrinsic motivation dictates how and why the task must be done. Rigid evaluations and strict reward contingencies stifle the ideation and creativity phase. Synergistic, enabling extrinsic motivation offers resources, recognizes competence, and clears blockers. Supportive feedback, tools, and clear milestones enhance creativity by supporting intrinsic drive.", "runs": [{"t": "Teresa Amabile’s caveat, the distinction between good and bad extrinsic motivation. Controlling, non-synergistic extrinsic motivation dictates how and why the task must be done. Rigid evaluations and strict reward contingencies stifle the ideation and creativity phase. Synergistic, enabling extrinsic motivation offers resources, recognizes competence, and clears blockers. Supportive feedback, tools, and clear milestones enhance creativity by supporting intrinsic drive.", "b": false}]}, {"nest": 1, "text": "Iconoclasts: Bill Russell was a role model to Samuel L. Jackson and inspired him to think he could be on TV. Russell did not want to shoot hoops because he thought of basketball as his job. They both loved golf, so they did that. Your note: he probably loved basketball at some point, and extrinsic motivators could have killed it.", "runs": [{"t": "Iconoclasts: Bill Russell was a role model to Samuel L. Jackson and inspired him to think he could be on TV. Russell did not want to shoot hoops because he thought of basketball as his job. They both loved golf, so they did that. Your note: he probably loved basketball at some point, and extrinsic motivators could have killed it.", "b": false}]}, {"nest": 1, "text": "Work Preferences Inventory is how researchers measure intrinsic versus extrinsic motivation. People rate these about themselves. Intrinsic: I enjoy new problems, complexity, and more difficult problems. It is important to express myself. Curiosity drives much of what I do. Extrinsic: I think about income goals, money, promotion goals, and recognition.", "runs": [{"t": "Work Preferences Inventory is how researchers measure intrinsic versus extrinsic motivation. People rate these about themselves. Intrinsic: I enjoy new problems, complexity, and more difficult problems. It is important to express myself. Curiosity drives much of what I do. Extrinsic: I think about income goals, money, promotion goals, and recognition.", "b": false}]}, {"nest": 1, "text": "McGregor’s Theory X and Theory Y, from the mid-20th century organizational assumptions in the same notes. Theory X: people are lazy and want to do as little as possible, so they must be coerced through extrinsic motivators, monitoring and threats. Theory Y: people seek responsibility and a positive impact, so they can be motivated with intrinsic motivation when the job gives pride, good design, and autonomy. Your note: it is not binary. You can balance both, as in sprints at Martian.", "runs": [{"t": "McGregor’s Theory X and Theory Y, from the mid-20th century organizational assumptions in the same notes. Theory X: people are lazy and want to do as ", "b": false}, {"t": "little as possible", "b": true}, {"t": ", so they must be coerced through extrinsic motivators, monitoring and threats. Theory Y: people seek ", "b": false}, {"t": "responsibility", "b": true}, {"t": " and a ", "b": false}, {"t": "positive impact", "b": true}, {"t": ", so they can be motivated with intrinsic motivation when the job gives pride, good design, and autonomy. Your note: it is not binary. You can balance both, as in sprints at Martian.", "b": false}]}, {"nest": 1, "text": "Pike Place Fish Market, from the same motivation notes. They were losing money and had two or three months of working capital. They made the work fun: throwing the fish, singing, joking while getting the job done. Every time someone calls an order, everyone yells it back. Your note calls this playing, finding ways of playing, and says it was fueled by people telling them they had made their day.", "runs": [{"t": "Pike Place Fish Market, from the same motivation notes. They were losing money and had two or three months of working capital. They made the work fun: throwing the fish, singing, joking while getting the job done. Every time someone calls an order, everyone yells it back. Your note calls this playing, finding ways of playing, and says it was fueled by people telling them they had made their day.", "b": false}]}, {"nest": 0, "text": "b. Scientific management", "runs": [{"t": "b. Scientific management", "b": false}]}, {"nest": 1, "text": "Early 20th century. Taylor and Gilbreth. Apply a scientific method to the work.", "runs": [{"t": "Early 20th century. Taylor and Gilbreth. Apply a scientific method to the work.", "b": false}]}, {"nest": 1, "text": "Time and motion studies: use a stopwatch to watch how long tasks take, set standard times, remove unnecessary actions, and reduce physical strain. The assumption is that there is one best way of doing things.", "runs": [{"t": "Time and motion studies: use a stopwatch to watch how long tasks take, set standard times, remove unnecessary actions, and reduce physical strain. The assumption is that there is one best way of doing things.", "b": false}]}, {"nest": 1, "text": "Chapter 7 note: scientific management breaks work into the smallest tasks, specializes people on those tasks, and uses time-and-motion studies to find the one best way. Pay is the main motivator.", "runs": [{"t": "Chapter 7 note: scientific management breaks work into the smallest tasks, specializes people on those tasks, and uses time-and-motion studies to find the one best way. Pay is the main motivator.", "b": false}]}, {"nest": 1, "text": "It pushes efficiency through extrinsic rewards.", "runs": [{"t": "It pushes efficiency through extrinsic rewards.", "b": false}]}, {"nest": 1, "text": "Your class example of the one best way: Amazon deliveries, where drivers never make right turns. A psychology-class point in your notes: watching people helps simple tasks and is not good for creative tasks, because people get better at simple tasks when watched and worse at hard or creative ones.", "runs": [{"t": "Your class example of the one best way: Amazon deliveries, where drivers never make right turns. A psychology-class point in your notes: watching people helps simple tasks and is not good for creative tasks, because people get better at simple tasks when watched and worse at hard or creative ones.", "b": false}]}, {"nest": 1, "text": "Job simplification and job specialization are the tools. Those notes are under the next item.", "runs": [{"t": "Job simplification", "b": true}, {"t": " and job specialization are the tools. Those notes are under the next item.", "b": false}]}, {"nest": 0, "text": "c. Job design, job simplification and specialization", "runs": [{"t": "c. Job design, job simplification and specialization", "b": false}]}, {"nest": 1, "text": "Job simplification: complex workflows become repeatable tasks, because less thinking means more output efficiency.", "runs": [{"t": "Job simplification", "b": true}, {"t": ": complex workflows become repeatable tasks, because less thinking means more output efficiency.", "b": false}]}, {"nest": 1, "text": "Job specialization: narrowing the scope to maximize task speed.", "runs": [{"t": "Job specialization", "b": true}, {"t": ": narrowing the scope to maximize task speed.", "b": false}]}, {"nest": 1, "text": "Job enlargement: adding more tasks at the same difficulty.", "runs": [{"t": "Job enlargement: adding more tasks at the same difficulty.", "b": false}]}, {"nest": 1, "text": "Job enrichment: adds responsibility and control, and learning new skills. It aims for intrinsic motivation.", "runs": [{"t": "Job enrichment: adds ", "b": false}, {"t": "responsibility", "b": true}, {"t": " and control, and learning new skills. It aims for intrinsic motivation.", "b": false}]}, {"nest": 1, "text": "Not everyone wants more. If they do not, enrichment can raise cost or reduce efficiency.", "runs": [{"t": "Not everyone wants more. If they do not, enrichment can raise cost or reduce efficiency.", "b": false}]}, {"nest": 1, "text": "Enlargement, enrichment, and the job characteristics model push intrinsic motivation by making work more meaningful, autonomous, and feedback-rich. Scientific management pushes efficiency through extrinsic rewards.", "runs": [{"t": "Enlargement, enrichment, and the job characteristics model push intrinsic motivation by making work more meaningful, autonomous, and feedback-rich. Scientific management pushes efficiency through extrinsic rewards.", "b": false}]}, {"nest": 0, "text": "d. Job characteristics theory, the Motivating Potential Score, and potential issues", "runs": [{"t": "d. Job characteristics theory, the Motivating Potential Score, and potential issues", "b": false}]}, {"nest": 1, "text": "Hackman and Oldham. Three psychological states.", "runs": [{"t": "Hackman and Oldham. Three psychological states.", "b": false}]}, {"nest": 1, "text": "Experienced meaningfulness comes from skill variety, task identity, meaning whole pieces of work, and task significance, meaning a substantial impact on others.", "runs": [{"t": "Experienced meaningfulness comes from ", "b": false}, {"t": "skill variety", "b": true}, {"t": ", ", "b": false}, {"t": "task identity", "b": true}, {"t": ", meaning whole pieces of work, and ", "b": false}, {"t": "task significance", "b": true}, {"t": ", meaning a substantial impact on others.", "b": false}]}, {"nest": 1, "text": "Experienced responsibility is autonomy: discretion on scheduling and procedures.", "runs": [{"t": "Experienced ", "b": false}, {"t": "responsibility", "b": true}, {"t": " is autonomy: discretion on scheduling and procedures.", "b": false}]}, {"nest": 1, "text": "Knowledge of results is direct and clear information about performance effectiveness.", "runs": [{"t": "Knowledge of results is direct and clear information about performance effectiveness.", "b": false}]}, {"nest": 1, "text": "The five job characteristics in your notes are skill variety, task identity, task significance, autonomy, and feedback.", "runs": [{"t": "The five job characteristics in your notes are ", "b": false}, {"t": "skill variety", "b": true}, {"t": ", ", "b": false}, {"t": "task identity", "b": true}, {"t": ", ", "b": false}, {"t": "task significance", "b": true}, {"t": ", autonomy, and feedback.", "b": false}]}, {"nest": 1, "text": "Class story: in a study of people getting donations for student scholarships, knowing the results that came from their work was the biggest signal for better performance.", "runs": [{"t": "Class story: in a study of people getting donations for student scholarships, knowing the results that came from their work was the biggest signal for better performance.", "b": false}]}, {"nest": 1, "text": "Tools in your notes: a direct line of sight to the beneficiary of the work, and the feeling that your unique skills make a difference.", "runs": [{"t": "Tools in your notes: a direct line of sight to the beneficiary of the work, and the feeling that your unique skills make a difference.", "b": false}]}, {"nest": 1, "text": "Procter and Gamble built and ran a factory in Augusta, Georgia, for years, hiding it from the unions, to show this job design was effective and not a trick to get people to leave the union.", "runs": [{"t": "Procter and Gamble built and ran a factory in Augusta, Georgia, for years, hiding it from the unions, to show this job design was effective and not a trick to get people to leave the union.", "b": false}]}, {"nest": 1, "text": "Japanese manufacturing in the same notes. The Andon cord at Toyota: any single worker on the line could pull a cord and stop the factory if they spotted a defect. Multi-skilled workers were cross-trained so they could rotate jobs. At Volvo, one worker follows the car through production.", "runs": [{"t": "Japanese manufacturing in the same notes. The Andon cord at Toyota: ", "b": false}, {"t": "any single worker", "b": true}, {"t": " on the line could pull a cord and stop the factory if they ", "b": false}, {"t": "spotted a defect", "b": true}, {"t": ". Multi-skilled workers were cross-trained so they could ", "b": false}, {"t": "rotate jobs", "b": true}, {"t": ". At Volvo, one worker follows the car through production.", "b": false}]}, {"nest": 1, "text": "Potential issues, from your notes. Not everyone wants a richer job. If they do not, enrichment can raise cost or reduce efficiency.", "runs": [{"t": "Potential issues, from your notes. Not everyone wants a richer job. If they do not, enrichment can raise cost or reduce efficiency.", "b": false}]}, {"nest": 1, "text": "Individual differences, from the chapter notes: growth-need strength, the desire for learning and development. Knowledge and skills, the ability to handle a richer job. Satisfaction with the work context: pay, security, and relationships.", "runs": [{"t": "Individual differences, from the chapter notes: growth-need strength, the desire for learning and development. Knowledge and skills, the ability to handle a richer job. Satisfaction with the work context: pay, security, and relationships.", "b": false}]}, {"nest": 1, "text": "Growth-need strength: people who value challenge, learning, and stretch want autonomy and task complexity. People who do not may feel anxiety in autonomy.", "runs": [{"t": "Growth-need strength: people who value challenge, learning, and stretch want autonomy and task complexity. People who do not may feel anxiety in autonomy.", "b": false}]}, {"nest": 1, "text": "Negative affectivity: a person’s baseline tilt toward stress and threat. The same autonomy can feel like freedom to one person and like exposure to another. Your note on affectivity: if someone has a poor home life, they may view life negatively, and that makes it harder for them to view the job positively. Perceptions drive reality. The employee has to see the job this way.", "runs": [{"t": "Negative affectivity: a person’s baseline tilt toward stress and threat. The same autonomy can feel like freedom to one person and like exposure to another. Your note on affectivity: if someone has a poor home life, they may view life negatively, and that makes it harder for them to view the job positively. Perceptions drive reality. The employee has to see the job this way.", "b": false}]}, {"nest": 1, "text": "Knowledge, skills, and abilities: autonomy without the knowledge, skills, and abilities to use it is a setup for failure.", "runs": [{"t": "Knowledge, skills, and abilities: autonomy without the knowledge, skills, and abilities to use it is a setup for failure.", "b": false}]}, {"nest": 1, "text": "Equity theory: as the job gets more complex, the person’s inputs go up, more skill, more effort, more responsibility, so they expect outcomes to move too, pay, recognition, or other rewards. If not, it feels unfair.", "runs": [{"t": "Equity theory: as the job gets more complex, the person’s inputs go up, more skill, more effort, more ", "b": false}, {"t": "responsibility", "b": true}, {"t": ", so they expect outcomes to move too, pay, recognition, or other rewards. If not, it feels unfair.", "b": false}]}, {"nest": 1, "text": "Social information processing is the other issue your notes attach here: people around the employee influence how they perceive the job. The fuller notes are the next item.", "runs": [{"t": "Social information processing is the other issue your notes attach here: people around the employee influence how they perceive the job. The fuller notes are the next item.", "b": false}]}, {"nest": 0, "text": "e. Social information processing theory", "runs": [{"t": "e. Social information processing theory", "b": false}]}, {"nest": 1, "text": "Salancik and Pfeffer.", "runs": [{"t": "Salancik and Pfeffer.", "b": false}]}, {"nest": 1, "text": "Social environment: coworkers and supervisors signal what to notice and how to judge the job.", "runs": [{"t": "Social environment: coworkers and supervisors signal what to notice and how to judge the job.", "b": false}]}, {"nest": 1, "text": "Past behavior: freely chosen sacrifices, for example working through school, make people more committed to seeing the job positively.", "runs": [{"t": "Past behavior: freely chosen sacrifices, for example working through school, make people more committed to seeing the job positively.", "b": false}]}, {"nest": 1, "text": "These two are especially strong for newcomers. Job design matters more over time.", "runs": [{"t": "These two are especially strong for newcomers. Job design matters more over time.", "b": false}]}, {"nest": 1, "text": "Class wording: peer opinions shape the individual’s perception of the job.", "runs": [{"t": "Class wording: peer opinions shape the individual’s perception of the job.", "b": false}]}, {"nest": 0, "text": "f. Self-determination theory", "runs": [{"t": "f. ", "b": false}, {"t": "Self-determination theory", "b": true}]}, {"nest": 1, "text": "Deci and Ryan. Three needs.", "runs": [{"t": "Deci and Ryan. Three needs.", "b": false}]}, {"nest": 1, "text": "Competence: self-efficacy, feeling able to master tasks, plus continuous learning and accomplishment.", "runs": [{"t": "Competence", "b": true}, {"t": ": self-efficacy, feeling able to master tasks, plus continuous learning and accomplishment.", "b": false}]}, {"nest": 1, "text": "Autonomy: an internal locus of control. Discretion over execution, methods, and timing.", "runs": [{"t": "Autonomy: an internal locus of control. Discretion over execution, methods, and timing.", "b": false}]}, {"nest": 1, "text": "Relatedness: social bonds in the community, feeling connected and valued, and meaningful team objectives or a shared purpose.", "runs": [{"t": "Relatedness", "b": true}, {"t": ": social bonds in the community, feeling connected and valued, and meaningful team objectives or a shared purpose.", "b": false}]}, {"nest": 1, "text": "In the same lecture notes, Kass’s total integrated system for intrinsic motivation: meaningfulness or purpose, competence, autonomy and control, seeing your impact, and relatedness.", "runs": [{"t": "In the same lecture notes, ", "b": false}, {"t": "Kass’s total", "b": true}, {"t": " integrated system for intrinsic motivation: meaningfulness or purpose, competence, autonomy and control, seeing your impact, and relatedness.", "b": false}]}, {"nest": null, "text": "2. Decision-making", "runs": [{"t": "2. Decision-making", "b": false}]}, {"nest": 0, "text": "a. Resulting", "runs": [{"t": "a. Resulting", "b": false}]}, {"nest": 1, "text": "A great decision is not off the outcome. It is off the process: the best you can do given what you know.", "runs": [{"t": "A great decision is not off the outcome. It is off the process: the best you can do given what you know.", "b": false}]}, {"nest": 1, "text": "Resulting is the cognitive shortcut of equating the quality of a decision directly with the quality of its outcome. Luck and unexpected noise break that link.", "runs": [{"t": "Resulting is the cognitive shortcut of equating the ", "b": false}, {"t": "quality of a decision", "b": true}, {"t": " directly with the ", "b": false}, {"t": "quality of its outcome", "b": true}, {"t": ". Luck and unexpected noise break that link.", "b": false}]}, {"nest": 1, "text": "Seahawks Super Bowl interception: a pass there is intercepted less than 2 percent of the time, and the call saved a critical timeout. The process was sound. The outcome was bad.", "runs": [{"t": "Seahawks Super Bowl interception: a pass there is intercepted less than 2 percent of the time, and the call saved a critical timeout. The process was sound. The outcome was bad.", "b": false}]}, {"nest": 1, "text": "Life is poker, not chess. Chess is perfect information and no luck. Poker is imperfect information plus luck on the next cards flipped. You can make a mathematically correct decision and still lose.", "runs": [{"t": "Life is poker, not chess. Chess is ", "b": false}, {"t": "perfect information", "b": true}, {"t": " and no luck. Poker is im", "b": false}, {"t": "perfect information", "b": true}, {"t": " plus luck on the next cards flipped. You can make a mathematically correct decision and still lose.", "b": false}]}, {"nest": 1, "text": "A bet is a choice made against an uncertain future state, where money, time, reputation, or opportunity is put at risk. Leaders often do not frame decisions as gambles. They prefer to project false absolute conviction. Your note: you like Yash and Etan to frame decisions as experiments instead.", "runs": [{"t": "A bet is a choice made against an uncertain future state, where money, time, reputation, or opportunity is put at risk. Leaders often do not frame decisions as gambles. They prefer to project false absolute conviction. Your note: you like Yash and Etan to frame decisions as experiments instead.", "b": false}]}, {"nest": 1, "text": "Seeing life as bets uncouples the ego and makes trade-offs, probabilities, and objectivity easier to see. You see risk, including opportunity cost and alternative scenarios. Unexpected outcomes become data, not personal failures.", "runs": [{"t": "Seeing life as bets uncouples the ego and makes trade-offs, probabilities, and objectivity easier to see. You see risk, including opportunity cost and alternative scenarios. Unexpected outcomes become data, not personal failures.", "b": false}]}, {"nest": 1, "text": "Carter Racing, from the same decision notes. To race: a new turbocharger, top 5 in 12 of 24 races, a big sponsorship if they finish top 5, and withdrawing could put them in debt. Not to race: the engine failed in 7 of 24 races and they have not identified the issue. The answer in your notes: do not anchor on incomplete data. Ask for the races where the engine did not fail. Temperature below 40 means it will fail. Seeing the breakdowns by temperature unveils the problem.", "runs": [{"t": "Carter Racing, from the same decision notes. To race: a new turbocharger, top 5 in 12 of 24 races, a big sponsorship if they finish top 5, and withdrawing could put them in debt. Not to race: the engine failed in 7 of 24 races and they have not identified the issue. The answer in your notes: ", "b": false}, {"t": "do not anchor on incomplete data", "b": true}, {"t": ". Ask for the races where the engine did not fail. Temperature below 40 means it will fail. Seeing the breakdowns by temperature unveils the problem.", "b": false}]}, {"nest": 0, "text": "b. The classical model of decision-making", "runs": [{"t": "b. The classical model of decision-making", "b": false}]}, {"nest": 1, "text": "Your notes call this the classical, or rational economic, model. It assumes perfect rationality and complete information.", "runs": [{"t": "Your notes call this the classical, or rational economic, model. It assumes perfect rationality and complete information.", "b": false}]}, {"nest": 1, "text": "Steps. Identify the problem: the gap between now and the preferred future, clearly. Identify the criteria. Weight the criteria objectively. List all the options. Assess the outcomes and consequences. Make the optimal choice, the one that maximizes satisfaction.", "runs": [{"t": "Steps. Identify the problem: the gap between now and the preferred future, clearly. Identify the criteria. Weight the criteria objectively. List all the options. Assess the outcomes and consequences. Make the optimal choice, the one that maximizes satisfaction.", "b": false}]}, {"nest": 0, "text": "c. The behavioral, or administrative, model of decision-making", "runs": [{"t": "c. The behavioral, or administrative, model of decision-making", "b": false}]}, {"nest": 1, "text": "In your notes, the administrative model is bounded rationality and satisficing. It is the place the classical model breaks.", "runs": [{"t": "In your notes, the administrative model is bounded rationality and satisficing. It is the place the classical model breaks.", "b": false}]}, {"nest": 1, "text": "The classical model assumes people do not have mental fatigue and have infinite time to decide. It assumes perfect information, probabilities, and costs. It assumes judgment free from ego, social dynamics, stress, and psychological bias.", "runs": [{"t": "The classical model assumes people do not have mental fatigue and have ", "b": false}, {"t": "infinite time to decide", "b": true}, {"t": ". It assumes ", "b": false}, {"t": "perfect information", "b": true}, {"t": ", probabilities, and costs. It assumes judgment free from ego, social dynamics, stress, and ", "b": false}, {"t": "psychological bias", "b": true}, {"t": ".", "b": false}]}, {"nest": 1, "text": "Because of that, being fully rational is not feasible. People satisfice: they select an option that is good enough rather than searching for absolute perfection. That is bounded rationality.", "runs": [{"t": "Because of that, being fully rational is not feasible. People satisfice: they select an option that is good enough rather than searching for absolute perfection. That is bounded rationality.", "b": false}]}, {"nest": 1, "text": "Bounded rationality: human decision-making is limited by available information, cognitive capacity, and time.", "runs": [{"t": "Bounded rationality: human decision-making is limited by available information, cognitive capacity, and time.", "b": false}]}, {"nest": 1, "text": "A heuristic ignores part of the information in order to decide more quickly, more frugally in mental effort, and, in some contexts, more accurately than complex methods. The double edge: heuristics create predictable errors in certain contexts. Those errors are biases.", "runs": [{"t": "A heuristic ignores part of the information in order to decide more quickly, more frugally in mental effort, and, in some contexts, more accurately than complex methods. The double edge: heuristics create predictable errors in certain contexts. Those errors are biases.", "b": false}]}, {"nest": 1, "text": "Your note: more than 180 cognitive biases have been logged. The practical move for a leader is to master a few core ones.", "runs": [{"t": "Your note: more than 180 cognitive biases have been logged. The practical move for a leader is to master a few core ones.", "b": false}]}, {"nest": 0, "text": "d. System 1 and System 2", "runs": [{"t": "d. System 1 and System 2", "b": false}]}, {"nest": 1, "text": "From Thinking, Fast and Slow, Daniel Kahneman.", "runs": [{"t": "From Thinking, Fast and Slow, Daniel Kahneman.", "b": false}]}, {"nest": 1, "text": "System 1 is fast, automatic, unconscious, effortless, and associative. It uses heuristics.", "runs": [{"t": "System 1 is fast, automatic, unconscious, effortless, and associative. It uses heuristics.", "b": false}]}, {"nest": 1, "text": "System 2 is slow, methodical, conscious, effortful, and logical. It is rule-based.", "runs": [{"t": "System 2 is slow, methodical, conscious, effortful, and logical. It is rule-based.", "b": false}]}, {"nest": 0, "text": "e. Confirmation bias", "runs": [{"t": "e. Confirmation bias", "b": false}]}, {"nest": 1, "text": "Your class name is confirmation, or primary, bias: the tendency to look for evidence that supports what we expect or hope is true.", "runs": [{"t": "Your class name is confirmation, or primary, bias: the tendency to look for evidence that supports what we expect or hope is true.", "b": false}]}, {"nest": 1, "text": "It shows up as selective search, and as biased evaluation: trusting favorable facts and scrutinizing the ones that contradict.", "runs": [{"t": "It shows up as selective search, and as biased evaluation: trusting favorable facts and scrutinizing the ones that contradict.", "b": false}]}, {"nest": 1, "text": "The card experiment in your notes. The claim “he predicts a rise, and it rises” is not established by collecting more of those cases. It is not true of the claim if he predicts a rise and it falls. You have to turn over the options that could make the claim false.", "runs": [{"t": "The card experiment in your notes. The claim “he predicts a rise, and it rises” is not established by collecting more of those cases. It is not true of the claim if he predicts a rise and it falls. You have to turn over the options that could make the claim false.", "b": false}]}, {"nest": 1, "text": "Hammond, confirming evidence: people decide what they want, then look for reasons. Both supporters and opponents of capital punishment read the same pair of studies and came out more convinced of their original view.", "runs": [{"t": "Hammond, confirming evidence: people decide what they want, then look for reasons. Both supporters and opponents of capital punishment read the same pair of studies and came out more convinced of their original view.", "b": false}]}, {"nest": 1, "text": "Defenses from that article. Have someone argue the other side. Write the three strongest reasons to do something else. Stop asking advisers questions that only invite agreement.", "runs": [{"t": "Defenses from that article. ", "b": false}, {"t": "Have someone argue the other side", "b": true}, {"t": ". ", "b": false}, {"t": "Write the three strongest reasons to do something else", "b": true}, {"t": ". ", "b": false}, {"t": "Stop asking advisers questions that only invite agreement", "b": true}, {"t": ".", "b": false}]}, {"nest": 1, "text": "Class on October 5: confirmation bias is one reason people raise their bids.", "runs": [{"t": "Class on October 5: confirmation bias is one reason people raise their bids.", "b": false}]}, {"nest": 0, "text": "f. Representativeness bias", "runs": [{"t": "f. ", "b": false}, {"t": "Representativeness", "b": true}, {"t": " bias", "b": false}]}, {"nest": 1, "text": "Representativeness judges how likely something is by how closely it matches a stereotype or a typical case, and it ignores how common that case actually is.", "runs": [{"t": "Representativeness", "b": true}, {"t": " judges how likely something is by how closely it matches a stereotype or a typical case, and it ignores how common that case actually is.", "b": false}]}, {"nest": 0, "text": "g. Availability heuristic", "runs": [{"t": "g. Availability heuristic", "b": false}]}, {"nest": 1, "text": "Availability bias: assume that easily imaginable events are more likely to happen and more likely to be true.", "runs": [{"t": "Availability bias: assume that easily imaginable events are more likely to happen and more likely to be true.", "b": false}]}, {"nest": 1, "text": "It is strengthened by repetition, experienced emotions, and closeness.", "runs": [{"t": "It is strengthened by repetition, experienced emotions, and closeness.", "b": false}]}, {"nest": 1, "text": "Example: many more people are killed in a year by stomach cancer, but people tend to think of car accidents.", "runs": [{"t": "Example: many more people are killed in a year by stomach cancer, but people tend to think of car accidents.", "b": false}]}, {"nest": 1, "text": "Hammond calls the same trap recallability. Vivid events, plane crashes, huge jury awards, a friend’s illness, feel more likely than they are. Use base rates, not the story that sticks.", "runs": [{"t": "Hammond calls the same trap recallability. Vivid events, plane crashes, huge jury awards, a friend’s illness, feel more likely than they are. Use base rates, not the story that sticks.", "b": false}]}, {"nest": 0, "text": "h. Overconfidence and illusion of control", "runs": [{"t": "h. Overconfidence and illusion of control", "b": false}]}, {"nest": 1, "text": "Positive cognitive illusions: the tendency to overestimate favorable outcomes, your own standing, and your control over complex external events.", "runs": [{"t": "Positive cognitive illusions", "b": true}, {"t": ": the tendency to overestimate favorable outcomes, your own standing, and your control over complex external events.", "b": false}]}, {"nest": 1, "text": "Study in your notes: about 70 percent of people rate themselves above average. By definition only about half can be above average.", "runs": [{"t": "Study in your notes: about 70 percent of people rate themselves above average. By definition only about half can be above average.", "b": false}]}, {"nest": 1, "text": "Hammond, overconfidence in guesses and estimates: you assume and plan around too narrow a range of possibilities.", "runs": [{"t": "Hammond, overconfidence in guesses and estimates: you assume and plan around too narrow a range of possibilities.", "b": false}]}, {"nest": 1, "text": "Experiment: people were asked to choose a Dow closing high and low such that there was a 1 percent chance the close fell outside. They were wrong 20 to 30 percent of the time. They could have picked a wider bracket.", "runs": [{"t": "Experiment: people were asked to choose a Dow closing high and low such that there was a 1 percent chance the close fell outside. They were wrong 20 to 30 percent of the time. They could have picked a wider bracket.", "b": false}]}, {"nest": 1, "text": "Business example: you say a new product will sell 80,000 to 100,000 units, and you plan as if anything outside that is basically impossible. The real range might be 40,000 to 160,000.", "runs": [{"t": "Business example: you ", "b": false}, {"t": "say a new product will sell 80,000 to 100,000 units, and you plan as if anything outside that is basically impossible. The real range might be 40,000 to 160,000", "b": true}, {"t": ".", "b": false}]}, {"nest": 1, "text": "Defense: start at the edges. Write the lowest plausible number and the highest, then ask what would have to happen for the truth to be even lower, or even higher. Widen the range until you cannot easily invent that story.", "runs": [{"t": "Defense: start at the edges. Write the lowest plausible number and the highest, then ask what would have to happen for the truth to be even lower, or even higher. Widen the range until you cannot easily invent that story.", "b": false}]}, {"nest": 1, "text": "Illusion of control is overestimating your control over complex external events.", "runs": [{"t": "Illusion of control is overestimating your control over complex external events.", "b": false}]}, {"nest": 0, "text": "i. Anchoring and adjustment, also called positive and negative framing on the sheet", "runs": [{"t": "i. Anchoring and adjustment, also called positive and negative framing on the sheet", "b": false}]}, {"nest": 1, "text": "Your notes keep anchoring and framing as two traps. The sheet folds them into one item, so both sets of notes are here.", "runs": [{"t": "Your notes keep anchoring and framing as two traps. The sheet folds them into one item, so both sets of notes are here.", "b": false}]}, {"nest": 1, "text": "Anchor bias: the tendency to rely heavily on an initial piece of information, the anchor, when making estimates or choices, even when the anchor is arbitrary or irrelevant. Insufficient adjustment: the final judgment ends closer to the starting point than it logically should.", "runs": [{"t": "Anchor bias: the tendency to rely heavily on an initial piece of information, the anchor, when making estimates or choices, even when the anchor is arbitrary or irrelevant. Insufficient adjustment: the final judgment ends closer to the starting point than it logically should.", "b": false}]}, {"nest": 1, "text": "Experiment: writing the digits of your phone number predicts whether you over- or under-estimate the number of faculty, because high or low digits pull the estimate.", "runs": [{"t": "Experiment: writing the digits of your phone number predicts whether you over- or under-estimate the number of faculty, because high or low digits pull the estimate.", "b": false}]}, {"nest": 1, "text": "Hammond: a landlord’s opening lease terms pull the tenant’s counteroffer toward that frame. Defense: think the problem through from first principles, try different starting points, and tell advisers as little as possible about your own estimate so they do not echo it. In a negotiation, set your position before you hear theirs.", "runs": [{"t": "Hammond: a landlord’s opening lease terms pull the tenant’s counteroffer toward that frame. Defense: think the problem through from first principles, try different starting points, and tell advisers as ", "b": false}, {"t": "little as possible", "b": true}, {"t": " about your own estimate so they do not echo it. In a negotiation, set your position before you hear theirs.", "b": false}]}, {"nest": 1, "text": "Framing, from class: people focused on what they might gain, a positive frame, tend to be risk averse. People focused on what they might lose, a negative frame, tend to be risk seeking. Layoff problem in your notes: people were more likely to go with 6,000 jobs saved at a one-third probability.", "runs": [{"t": "Framing, from class: people focused on what they might gain, a positive frame, tend to be ", "b": false}, {"t": "risk averse", "b": true}, {"t": ". People focused on what they might lose, a negative frame, tend to be ", "b": false}, {"t": "risk seeking", "b": true}, {"t": ". Layoff problem in your notes: people were more likely to go with 6,000 jobs saved at a one-third probability.", "b": false}]}, {"nest": 1, "text": "Hammond: the same facts, worded as gains or as losses, produce opposite choices. Insurance adjusters preferred a sure save of one barge when the problem was framed as cargo saved, and a gamble when the identical math was framed as cargo lost.", "runs": [{"t": "Hammond: the same facts, worded as gains or as losses, produce opposite choices. ", "b": false}, {"t": "Insurance adjusters", "b": true}, {"t": " preferred a sure save of one barge when the problem was framed as cargo saved, and a gamble when the identical math was framed as cargo lost.", "b": false}]}, {"nest": 1, "text": "New Jersey and Pennsylvania offered drivers the same limited right to sue. The state that made the limited right the default got about 80 percent uptake. The other got about 25 percent. The authors put the gap at roughly 200 million dollars.", "runs": [{"t": "New Jersey and Pennsylvania offered drivers the same limited right to sue. The state that made the limited right the default got about 80 percent uptake. The other got about 25 percent. The authors put the gap at roughly 200 million dollars.", "b": false}]}, {"nest": 1, "text": "Framing defense: restate the problem in both gain and loss language, and restate it with more than one reference point.", "runs": [{"t": "Framing defense: restate the problem in both gain and loss language, and restate it with more than one reference point.", "b": false}]}, {"nest": 0, "text": "j. Status quo bias", "runs": [{"t": "j. Status quo bias", "b": false}]}, {"nest": 1, "text": "People prefer the current state because changing it means taking responsibility and risking regret.", "runs": [{"t": "People prefer the current state because changing it means taking ", "b": false}, {"t": "responsibility", "b": true}, {"t": " and risking regret.", "b": false}]}, {"nest": 1, "text": "Experiments show people keep a randomly assigned gift even when swapping is free. More alternatives make the default even stickier.", "runs": [{"t": "Experiments show people keep a randomly assigned gift even when swapping is free. More alternatives make the default even stickier.", "b": false}]}, {"nest": 1, "text": "Defense: choose the current path only if you would choose it were it not already the default. Do not treat “hard to pick among better options” as a reason to stay put.", "runs": [{"t": "Defense: choose the current path only if you would choose it were it not already the default. Do not treat “hard to pick among better options” as a reason to stay put.", "b": false}]}, {"nest": 1, "text": "Class on October 5: without psychological safety, people do the thing perceived as safe, and people refuse to admit they made a mistake. In finance: nobody got fired for buying IBM.", "runs": [{"t": "Class on October 5: without psychological safety, people do the thing perceived as safe, and people refuse to admit they made a mistake. In finance: nobody got fired for buying IBM.", "b": false}]}, {"nest": 0, "text": "k. Sunk cost bias", "runs": [{"t": "k. Sunk cost bias", "b": false}]}, {"nest": 1, "text": "Sunk cost effect: we tend to hold on to costs we have already incurred. A cost is sunk when it cannot be recovered. Once it is sunk, it has no effect on the incremental payoffs of future decisions, and therefore plays no role in rational choice.", "runs": [{"t": "Sunk cost effect: we tend to hold on to costs we have already incurred. A cost is sunk when it cannot be recovered. Once it is sunk, it has no effect on the incremental payoffs of future decisions, and therefore plays no role in rational choice.", "b": false}]}, {"nest": 1, "text": "Example: you buy a sandwich, and halfway through you do not like it and you are not hungry. You eat it anyway to get your money’s worth.", "runs": [{"t": "Example: you buy a sandwich, and halfway through you do not like it and you are not hungry. You eat it anyway to get your money’s worth.", "b": false}]}, {"nest": 1, "text": "Hammond: past money, time, or reputation gets treated as a reason to continue. Bankers who originated bad loans kept advancing more funds. Bankers who inherited the accounts did not. The fix used by one bank was to reassign a troubled loan the moment it went bad.", "runs": [{"t": "Hammond: past money, time, or reputation gets treated as a reason to continue. Bankers who originated bad loans kept advancing more funds. Bankers who inherited the accounts did not. ", "b": false}, {"t": "The fix used by one bank was to reassign a troubled loan the moment it went bad", "b": true}, {"t": ".", "b": false}]}, {"nest": 1, "text": "Remedies in that article: reward the quality of the decision given what was known at the time. And Buffett: when you are in a hole, stop digging.", "runs": [{"t": "Remedies in that article: reward the quality of the decision given what was known at the time. And Buffett: when you are in a hole, stop digging.", "b": false}]}, {"nest": 0, "text": "l. Confirmation bias, listed again", "runs": [{"t": "l. Confirmation bias, listed again", "b": false}]}, {"nest": 1, "text": "The sheet lists confirmation bias a second time. The notes are under item e in this decision-making section.", "runs": [{"t": "The sheet lists confirmation bias a second time. The notes are under item e in this decision-making section.", "b": false}]}, {"nest": 0, "text": "m. Overconfidence and illusion of control, listed again", "runs": [{"t": "m. Overconfidence and illusion of control, listed again", "b": false}]}, {"nest": 1, "text": "The sheet lists overconfidence and illusion of control a second time. The notes are under item h in this decision-making section.", "runs": [{"t": "The sheet lists overconfidence and illusion of control a second time. The notes are under item h in this decision-making section.", "b": false}]}, {"nest": 0, "text": "n. Escalation of commitment, and the remedies on the slide deck", "runs": [{"t": "n. Escalation of commitment, and the remedies on the slide deck", "b": false}]}, {"nest": 1, "text": "Escalation of commitment: inappropriately continuing to invest time, capital, or effort into a demonstrably losing course of action.", "runs": [{"t": "Escalation of commitment: inappropriately continuing to invest time, capital, or effort into a demonstrably losing course of action.", "b": false}]}, {"nest": 1, "text": "Stages in your notes. Initial commitment: a prior decision to commit. The situation does not pay off as expected. Then the temptation to continue the investment in order to justify the prior losses.", "runs": [{"t": "Stages in your notes. Initial commitment: a prior decision to commit. The situation does not pay off as expected. Then the temptation to continue the investment in order to justify the prior losses.", "b": false}]}, {"nest": 1, "text": "The dollar-auction experiment. Bids go up in 50 cent increments, bidding for 10 dollars. If you are the second-highest bidder, you pay your bid and get nothing. Once the bids pass 10 dollars, the leader still loses less by going 50 cents higher than by dropping out and paying their last bid for nothing. Bidding often ends well above the value of the bill.", "runs": [{"t": "The dollar-auction experiment. Bids go up in 50 cent increments, bidding for 10 dollars. If you are the second-highest bidder, you pay your bid and get nothing. Once the bids pass 10 dollars, the leader still loses less by going 50 cents higher than by dropping out and paying their last bid for nothing. Bidding often ends well above the value of the bill.", "b": false}]}, {"nest": 1, "text": "Remedies on your slides. Set a loss limit beforehand. Create decision points where you can change course. Realize that smart people can make bad choices because information is imperfect, and disconnect your ego from the decision.", "runs": [{"t": "Remedies on your slides. Set a loss limit beforehand. Create decision points where you can change course. Realize that smart people can make bad choices because information is imperfect, and disconnect your ego from the decision.", "b": false}]}, {"nest": 1, "text": "Imagine what you would do if it were a new project. Have others critically review the project history. Use a devil’s advocate.", "runs": [{"t": "Imagine what you would do if it were a new project. ", "b": false}, {"t": "Have others critically review the project history", "b": true}, {"t": ". Use a devil’s advocate.", "b": false}]}, {"nest": 1, "text": "Pre-mortem. “What are all the things that could possibly go wrong?” is the poor framing. Instead: imagine it is six months from now and the project failed. Why did it fail? What went wrong? Write out the story if you get stuck.", "runs": [{"t": "Pre-mortem. “What are all the things that could possibly go wrong?” is the poor framing. Instead: imagine it is six months from now and the project failed. Why did it fail? What went wrong? Write out the story if you get stuck.", "b": false}]}, {"nest": 1, "text": "Red teaming: an independent group acts as an adversary to test the organization’s defenses, strategies, or systems.", "runs": [{"t": "Red teaming", "b": true}, {"t": ": an independent group acts as an adversary to test the organization’s defenses, strategies, or systems.", "b": false}]}, {"nest": 1, "text": "Let sunk costs go, and look for framing effects.", "runs": [{"t": "Let sunk costs go, and look for framing effects.", "b": false}]}, {"nest": 1, "text": "Class note next to this: pick a date, look at the data, and do a retro on how you want to change your decision-making from there.", "runs": [{"t": "Class note next to this: pick a date, look at the data, and do a retro on how you want to change your decision-making from there.", "b": false}]}, {"nest": 1, "text": "Hammond’s conclusion, which ties the traps together. The traps reinforce each other. A first impression anchors you, confirming evidence justifies it, the choice becomes the new status quo, and sunk costs make it harder to leave. Complex, high-stakes decisions are the most exposed because they rest on the most assumptions and on other people’s estimates. Put mechanisms in place to account for these distortions.", "runs": [{"t": "Hammond’s conclusion, which ties the traps together. The traps reinforce each other. A first impression anchors you, confirming evidence justifies it, the choice becomes the new status quo, and sunk costs make it harder to leave. Complex, high-stakes decisions are the most exposed because they rest on the most assumptions and on other people’s estimates. Put mechanisms in place to account for these distortions.", "b": false}]}, {"nest": null, "text": "3. Groups and teams", "runs": [{"t": "3. Groups and teams", "b": false}]}, {"nest": 0, "text": "a. Cohesion", "runs": [{"t": "a. Cohesion", "b": false}]}, {"nest": 1, "text": "From the chapter 11 reading: group cohesiveness is how attractive the group is to its members.", "runs": [{"t": "From the chapter 11 reading: group cohesiveness is how attractive the group is to its members.", "b": false}]}, {"nest": 1, "text": "Virtual teams, from the same reading: members are often less satisfied, and cohesiveness is often lower.", "runs": [{"t": "Virtual teams, from the same reading: members are often less satisfied, and cohesiveness is often lower.", "b": false}]}, {"nest": 0, "text": "a, i. The components of cohesion", "runs": [{"t": "a, i. The components of cohesion", "b": false}]}, {"nest": 1, "text": "Your updated slides list the components as task cohesion, social cohesion, group morale and loyalty, and shared identity.", "runs": [{"t": "Your updated slides list the components as task cohesion, social cohesion, group morale and loyalty, and shared identity.", "b": false}]}, {"nest": 1, "text": "Monday slides: morale is loyalty to the group and its members.", "runs": [{"t": "Monday slides: morale is loyalty to the group and its members.", "b": false}]}, {"nest": 0, "text": "a, ii. The primary drivers of cohesion", "runs": [{"t": "a, ii. The primary drivers of cohesion", "b": false}]}, {"nest": 1, "text": "Slide drivers: group size. Required interaction patterns, meaning frequency and intensity. Success. Homogeneity, which your notes call the opposite of diversity. External threat. Difficulty of membership. Reward system. Precondition: stability.", "runs": [{"t": "Slide drivers: group size. Required interaction patterns, meaning frequency and intensity. Success. Homogeneity, which your notes call the opposite of diversity. External threat. Difficulty of membership. Reward system. Precondition: stability.", "b": false}]}, {"nest": 1, "text": "Stability, from the updated slides: member longevity and low turnover.", "runs": [{"t": "Stability, from the updated slides: member longevity and low turnover.", "b": false}]}, {"nest": 1, "text": "The reading’s five drivers: smaller size, about 3 to 15. Similarity among members. Competition with other groups. Exclusiveness, meaning membership is hard to earn. Diversity can still help cohesiveness when the different skills are what let the group succeed. Too much competition between groups turns into sabotage.", "runs": [{"t": "The reading’s five drivers: smaller size, about 3 to 15. Similarity among members. Competition with other groups. Exclusiveness, meaning membership is hard to earn. Diversity can still help cohesiveness when the different skills are what let the group succeed. Too much competition between groups turns into sabotage.", "b": false}]}, {"nest": 0, "text": "b. Group and performance norms", "runs": [{"t": "b. Group and performance norms", "b": false}]}, {"nest": 1, "text": "Norm enforcer: a highly cohesive group rigorously enforces shared norms and behavioral rules.", "runs": [{"t": "Norm enforcer: a highly cohesive group rigorously enforces ", "b": false}, {"t": "shared norms", "b": true}, {"t": " and ", "b": false}, {"t": "behavioral rules", "b": true}, {"t": ".", "b": false}]}, {"nest": 1, "text": "The group creates a performance norm, aiming for an A, a B, or a C minus. Working far above or far below that norm feels inappropriate.", "runs": [{"t": "The group creates a performance norm, aiming for an A, a B, or a C minus. Working far above or far below that norm feels inappropriate.", "b": false}]}, {"nest": 1, "text": "Monday slides: highly cohesive groups follow the norms.", "runs": [{"t": "Monday slides: highly cohesive groups follow the norms.", "b": false}]}, {"nest": 0, "text": "c. How cohesion and performance norms affect group performance", "runs": [{"t": "c. How cohesion and performance norms affect group performance", "b": false}]}, {"nest": 1, "text": "High cohesion: people want to satisfy their teammates, and they do not want to be rejected for failing to conform.", "runs": [{"t": "High cohesion", "b": true}, {"t": ": people want to satisfy their teammates, and they do not want to be rejected for failing to conform.", "b": false}]}, {"nest": 1, "text": "Low cohesion: apathy about teammates’ satisfaction, and people do not care about adhering to the norms.", "runs": [{"t": "Low cohesion: apathy about teammates’ satisfaction, and people do not care about adhering to the norms.", "b": false}]}, {"nest": 1, "text": "High cohesion and high performance norms: the best team. High cohesion and low performance norms: the worst team.", "runs": [{"t": "High cohesion", "b": true}, {"t": " and high performance norms: the best team. ", "b": false}, {"t": "High cohesion", "b": true}, {"t": " and low performance norms: the worst team.", "b": false}]}, {"nest": 1, "text": "If you value membership highly, you want to make your teammates happy and you want to avoid displeasing them. Your example is Mean Girls.", "runs": [{"t": "If you value membership highly, you want to make your teammates happy and you want to avoid displeasing them. Your example is Mean Girls.", "b": false}]}, {"nest": 0, "text": "d, i. The performance benefits of diversity", "runs": [{"t": "d, i. The performance benefits of diversity", "b": false}]}, {"nest": 1, "text": "Diversity improves performance, particularly on tasks with cognitive, problem-solving, or creative elements.", "runs": [{"t": "Diversity improves performance, particularly on tasks with cognitive, ", "b": false}, {"t": "problem-solving", "b": true}, {"t": ", or ", "b": false}, {"t": "creative elements", "b": true}, {"t": ".", "b": false}]}, {"nest": 1, "text": "Updated slides: it improves cognitive and complex task outcomes. It supports creative problem-solving and innovation, and it prevents groupthink.", "runs": [{"t": "Updated slides: it improves cognitive and complex task outcomes. It supports creative ", "b": false}, {"t": "problem-solving", "b": true}, {"t": " and innovation, and it prevents groupthink.", "b": false}]}, {"nest": 1, "text": "From the cohesiveness reading: diversity can still help cohesiveness when the different skills are what let the group succeed.", "runs": [{"t": "From the cohesiveness reading: diversity can still help cohesiveness when the different skills are what let the group succeed.", "b": false}]}, {"nest": 0, "text": "d, ii. Negative performance consequences of diversity, the mechanisms, and how to manage them", "runs": [{"t": "d, ii. Negative performance consequences of diversity, the mechanisms, and how to manage them", "b": false}]}, {"nest": 1, "text": "Diversity can increase stress, lower cohesion, and produce dysfunctional conflict.", "runs": [{"t": "Diversity can increase stress, lower cohesion, and produce dysfunctional conflict.", "b": false}]}, {"nest": 1, "text": "Similar-to-me effect. Your notes’ management moves: change which identities and characteristics are salient, and reframe the group identity around shared superordinate goals rather than demographic or functional differences.", "runs": [{"t": "Similar-to-me effect. Your notes’ management moves: change which identities and characteristics are salient, and reframe the group identity around shared superordinate goals rather than demographic or functional differences.", "b": false}]}, {"nest": 1, "text": "Cross-cultural miscommunication. Manage it with psychological safety. Your earlier slide also lists cross-cultural awareness.", "runs": [{"t": "Cross-cultural miscommunication. Manage it with psychological safety. Your earlier slide also lists cross-cultural awareness.", "b": false}]}, {"nest": 1, "text": "Stereotyping and bias. Manage it with clear, transparent performance data, and by increasing structured interaction among members so assumptions get dismantled. Your earlier slide also says reduce stereotypes and schemas.", "runs": [{"t": "Stereotyping and bias. Manage it with clear, transparent performance data, and by increasing structured interaction among members so assumptions get dismantled. Your earlier slide also says reduce stereotypes and schemas.", "b": false}]}, {"nest": 1, "text": "The “key to diversity” list in your notes: perceived similarity and shared identity, cross-cultural awareness, communication and conflict skills, and reducing stereotypes and schemas.", "runs": [{"t": "The “key to diversity” list in your notes: perceived similarity and shared identity, cross-cultural awareness, communication and conflict skills, and reducing stereotypes and schemas.", "b": false}]}, {"nest": 1, "text": "Working agreements explicitly set out the team norms.", "runs": [{"t": "Working agreements explicitly set out the team norms.", "b": false}]}]

<script>
const items = JSON.parse(document.getElementById("notes").textContent);
const doc = document.getElementById("doc");
const playBtn = document.getElementById("play");
const prog = document.getElementById("prog");
const r1 = document.getElementById("r1");
const r2 = document.getElementById("r2");
const blocks = [];
items.forEach((item, i) => {
  const el = document.createElement(item.nest == null ? "h2" : "p");
  el.className = item.nest == null ? "sec" : item.nest === 0 ? "term" : "note";
  if (item.gap) el.classList.add("gap");
  (item.runs || [{t: item.text, b: false}]).forEach(r => {
    if (r.b) {
      const s = document.createElement("span");
      s.className = "b";
      s.textContent = r.t;
      el.appendChild(s);
    } else {
      el.appendChild(document.createTextNode(r.t));
    }
  });
  el.addEventListener("click", () => jump(i));
  doc.appendChild(el);
  blocks.push(el);
});

let idx = Number(localStorage.getItem("lp105-exam2-review-idx") || 0);
if (!Number.isFinite(idx) || idx < 0 || idx >= items.length) idx = 0;
let part = 0;
let parts = [];
let playing = false;
let rate = Number(localStorage.getItem("lp105-exam2-review-rate") || 1);
if (rate !== 2) rate = 1;
let token = 0;
let lock = null;

function speakable(s) {
  return s
    .replace(/^\s*[-–—]\s*/, "")
    .replace(/\bIe\.?/g, "For example")
    .replace(/\bie\.?/g, "for example")
    .replace(/\bppl\b/gi, "people")
    .replace(/\bGNS\b/g, "growth need strength")
    .replace(/\bKSAs\b/g, "knowledge, skills, and abilities")
    .replace(/\bKSA\b/g, "knowledge, skills, and abilities")
    .replace(/\bMOi\b/g, "intrinsic motivation")
    .replace(/\bMOe\b/g, "extrinsic motivation")
    .replace(/\bDow\b/g, "Dow Jones")
    .replace(/\bw\//g, "with ")
    .replace(/→/g, ". ")
    .replace(/~/g, "about ")
    .replace(/#/g, " number ")
    .replace(/⅓/g, " one third ")
    .replace(/½/g, " one half ")
    .replace(/\s+/g, " ")
    .trim();
}
function chunk(s) {
  const out = [];
  let cur = "";
  const words = s.split(" ");
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    const next = cur ? cur + " " + w : w;
    const end = /[.!?]$/.test(w);
    if (next.length > 190 && cur) {
      out.push(cur);
      cur = w;
    } else {
      cur = next;
    }
    if (end && cur.length > 40) {
      out.push(cur);
      cur = "";
    }
  }
  if (cur) out.push(cur);
  return out.length ? out : [s];
}
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /en-US/i.test(v.lang) && /samantha|aaron|nicky|google/i.test(v.name))
    || voices.find(v => /^en/i.test(v.lang));
}
function mark() {
  blocks.forEach(el => el.classList.remove("on"));
  const el = blocks[idx];
  if (!el) return;
  el.classList.add("on");
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  prog.textContent = (idx + 1) + " / " + items.length;
  localStorage.setItem("lp105-exam2-review-idx", String(idx));
}
function paintRate() {
  r1.classList.toggle("pick", rate === 1);
  r2.classList.toggle("pick", rate === 2);
  localStorage.setItem("lp105-exam2-review-rate", String(rate));
}
function loadParts() {
  parts = chunk(speakable(items[idx].text));
  part = 0;
}
async function wake() {
  try {
    if (navigator.wakeLock) lock = await navigator.wakeLock.request("screen");
  } catch (e) {}
}
function speakCurrent() {
  const my = ++token;
  const u = new SpeechSynthesisUtterance(parts[part]);
  u.rate = rate;
  u.lang = "en-US";
  const v = pickVoice();
  if (v) u.voice = v;
  const advance = () => {
    if (my !== token || !playing) return;
    part += 1;
    if (part >= parts.length) {
      idx += 1;
      if (idx >= items.length) idx = 0;
      loadParts();
      mark();
    }
    speakCurrent();
  };
  u.onend = advance;
  u.onerror = (e) => {
    const err = e && e.error;
    if (err === "interrupted" || err === "canceled" || err === "cancelled") return;
    advance();
  };
  speechSynthesis.speak(u);
}
function finish() {
  playing = false;
  playBtn.textContent = "Play";
  token++;
  if (idx >= items.length) idx = 0;
  mark();
}
function play() {
  if (idx >= items.length) idx = 0;
  if (!parts.length || part >= parts.length) loadParts();
  playing = true;
  playBtn.textContent = "Pause";
  mark();
  wake();
  speakCurrent();
}
function pause() {
  playing = false;
  token++;
  playBtn.textContent = "Play";
  speechSynthesis.cancel();
}
function jump(i) {
  const was = playing;
  pause();
  idx = i;
  loadParts();
  mark();
  if (was) play();
}
playBtn.addEventListener("click", () => {
  if (playing) pause();
  else play();
});
function setRate(n) {
  rate = n;
  paintRate();
  if (!playing) return;
  const wasPart = part;
  pause();
  part = wasPart;
  play();
}
r1.addEventListener("click", () => setRate(1));
r2.addEventListener("click", () => setRate(2));
speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
// iPhone Safari pauses speech after a short stretch and never resumes. Nudge it.
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  setInterval(() => {
    if (!playing || !speechSynthesis.speaking) return;
    speechSynthesis.pause();
    speechSynthesis.resume();
  }, 10000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && playing) wake();
});
paintRate();
mark();
document.getElementById("hint").textContent = "Open this in Safari. Play reads each term, then your notes under it, and starts again at the top when it finishes. 1× and 2× set the speed. The page remembers where you stopped.";
</script>
